
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园互助平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .user-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .info-item label {
            color: #666;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        .info-item value {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .rating-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .rating-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .rating-item:last-child {
            border-bottom: none;
        }

        .rating-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .rating-score {
            color: #ffc107;
            font-size: 20px;
        }

        .hidden {
            display: none;
        }

        .nav-bar {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .nav-bar .user-greeting {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎓 校园互助平台</h1>
        <p>互帮互助，共建诚信校园</p>
    </div>

    <!-- 导航栏 -->
    <div id="navBar" class="nav-bar hidden">
        <div>
            <span class="user-greeting">欢迎，<span id="currentUser"></span>！</span>
            <span style="margin-left: 20px; color: #666;">信用分：<span id="creditScore" style="color: #667eea; font-weight: bold;"></span></span>
        </div>
        <button class="btn btn-secondary" onclick="logout()">退出登录</button>
    </div>

    <!-- 未登录界面 -->
    <div id="authSection" class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">登录</button>
            <button class="tab" onclick="switchTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginTab" class="tab-content active">
            <div id="loginMessage"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>

        <!-- 注册表单 -->
        <div id="registerTab" class="tab-content">
            <div id="registerMessage"></div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" required placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="regEmail" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" id="regRealName" placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="regPhone" placeholder="请输入手机号">
                </div>
                <button type="submit" class="btn btn-primary">注册</button>
            </form>
        </div>
    </div>

    <!-- 已登录界面 -->
    <div id="mainSection" class="hidden">
        <!-- 个人资料 -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">👤 个人资料</h2>
            <div id="profileInfo" class="user-info"></div>
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="showEditProfile()">编辑资料</button>
                <button class="btn btn-secondary" onclick="showChangePassword()">修改密码</button>
            </div>

            <!-- 编辑资料表单 -->
            <div id="editProfileForm" class="hidden" style="margin-top: 20px;">
                <h3 style="margin-bottom: 15px;">编辑资料</h3>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="editEmail">
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" id="editRealName">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="editPhone">
                </div>
                <div class="form-group">
                    <label>头像URL</label>
                    <input type="text" id="editAvatar">
                </div>
                <button class="btn btn-primary" onclick="updateProfile()">保存</button>
                <button class="btn btn-secondary" onclick="hideEditProfile()">取消</button>
            </div>

            <!-- 修改密码表单 -->
            <div id="changePasswordForm" class="hidden" style="margin-top: 20px;">
                <h3 style="margin-bottom: 15px;">修改密码</h3>
                <div class="form-group">
                    <label>原密码</label>
                    <input type="password" id="oldPassword">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
                <button class="btn btn-secondary" onclick="hideChangePassword()">取消</button>
            </div>
        </div>

        <!-- 评分功能 -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">⭐ 互相评分</h2>
            <div id="ratingMessage"></div>
            <form onsubmit="handleRating(event)">
                <div class="form-group">
                    <label>被评分人ID</label>
                    <input type="number" id="rateUserId" required placeholder="请输入要评分的用户ID">
                </div>
                <div class="form-group">
                    <label>评分（1-5星）</label>
                    <input type="number" id="rateScore" min="1" max="5" required placeholder="1-5">
                </div>
                <div class="form-group">
                    <label>评价内容</label>
                    <textarea id="rateContent" rows="3" placeholder="请输入评价内容"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">提交评分</button>
            </form>
        </div>

        <!-- 评分记录 -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">📋 收到的评分</h2>
            <div id="receivedRatings" class="rating-list"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api';
    let currentToken = localStorage.getItem('token');
    let currentUserData = null;

    // 初始化
    window.onload = function() {
        if (currentToken) {
            loadProfile();
        }
    };

    // 切换登录/注册标签
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(tab + 'Tab').classList.add('active');
    }

    // 显示消息
    function showMessage(elementId, message, isSuccess) {
        const div = document.createElement('div');
        div.className = 'message ' + (isSuccess ? 'success' : 'error');
        div.textContent = message;
        document.getElementById(elementId).innerHTML = '';
        document.getElementById(elementId).appendChild(div);
    }

    // 登录处理
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch(API_BASE + '/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.code === 200) {
                currentToken = data.data.token;
                currentUserData = data.data.user;
                localStorage.setItem('token', currentToken);
                showMessage('loginMessage', '登录成功！', true);
                setTimeout(() => loadProfile(), 500);
            } else {
                showMessage('loginMessage', data.msg || '登录失败', false);
            }
        } catch (error) {
            showMessage('loginMessage', '网络错误，请检查后端是否启动', false);
        }
    }

    // 注册处理
    async function handleRegister(e) {
        e.preventDefault();
        const data = {
            username: document.getElementById('regUsername').value,
            password: document.getElementById('regPassword').value,
            email: document.getElementById('regEmail').value,
            realName: document.getElementById('regRealName').value,
            phone: document.getElementById('regPhone').value
        };

        try {
            const response = await fetch(API_BASE + '/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.code === 200) {
                showMessage('registerMessage', '注册成功！请登录', true);
                setTimeout(() => switchTab('login'), 1000);
            } else {
                showMessage('registerMessage', result.msg || '注册失败', false);
            }
        } catch (error) {
            showMessage('registerMessage', '网络错误', false);
        }
    }

    // 加载个人资料
    async function loadProfile() {
        try {
            const response = await fetch(API_BASE + '/user/profile', {
                headers: { 'token': currentToken }
            });

            const data = await response.json();
            if (data.code === 200) {
                currentUserData = data.data;
                showMainSection();
            } else {
                logout();
            }
        } catch (error) {
            console.error('加载资料失败:', error);
            logout();
        }
    }

    // 显示主界面
    function showMainSection() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('navBar').classList.remove('hidden');

        document.getElementById('currentUser').textContent = currentUserData.username;
        document.getElementById('creditScore').textContent = currentUserData.creditScore;

        // 显示个人资料
        const profileHtml = `
                <div class="info-item">
                    <label>用户ID</label>
                    <value>${currentUserData.id}</value>
                </div>
                <div class="info-item">
                    <label>用户名</label>
                    <value>${currentUserData.username}</value>
                </div>
                <div class="info-item">
                    <label>邮箱</label>
                    <value>${currentUserData.email || '未设置'}</value>
                </div>
                <div class="info-item">
                    <label>真实姓名</label>
                    <value>${currentUserData.realName || '未设置'}</value>
                </div>
                <div class="info-item">
                    <label>手机号</label>
                    <value>${currentUserData.phone || '未设置'}</value>
                </div>
                <div class="info-item">
                    <label>信用分</label>
                    <value style="color: #667eea;">${currentUserData.creditScore}</value>
                </div>
            `;
        document.getElementById('profileInfo').innerHTML = profileHtml;

        loadReceivedRatings();
    }

    // 显示编辑资料表单
    function showEditProfile() {
        document.getElementById('editProfileForm').classList.remove('hidden');
        document.getElementById('changePasswordForm').classList.add('hidden');
        document.getElementById('editEmail').value = currentUserData.email || '';
        document.getElementById('editRealName').value = currentUserData.realName || '';
        document.getElementById('editPhone').value = currentUserData.phone || '';
        document.getElementById('editAvatar').value = currentUserData.avatar || '';
    }

    function hideEditProfile() {
        document.getElementById('editProfileForm').classList.add('hidden');
    }

    // 更新资料
    async function updateProfile() {
        const data = {
            email: document.getElementById('editEmail').value,
            realName: document.getElementById('editRealName').value,
            phone: document.getElementById('editPhone').value,
            avatar: document.getElementById('editAvatar').value
        };

        try {
            const response = await fetch(API_BASE + '/user/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'token': currentToken
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.code === 200) {
                alert('修改成功！');
                hideEditProfile();
                loadProfile();
            } else {
                alert(result.msg || '修改失败');
            }
        } catch (error) {
            alert('网络错误');
        }
    }

    // 显示修改密码表单
    function showChangePassword() {
        document.getElementById('changePasswordForm').classList.remove('hidden');
        document.getElementById('editProfileForm').classList.add('hidden');
    }

    function hideChangePassword() {
        document.getElementById('changePasswordForm').classList.add('hidden');
    }


    // 修改密码
    async function changePassword() {
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;

        if (!oldPassword || !newPassword) {
            alert('请填写完整');
            return;
        }

        try {
            const response = await fetch(API_BASE + '/user/password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'token': currentToken
                },
                body: JSON.stringify({ oldPassword, newPassword })
            });

            const result = await response.json();
            if (result.code === 200) {
                alert('密码修改成功！请重新登录');
                logout();
            } else {
                alert(result.msg || '修改失败');
            }
        } catch (error) {
            alert('网络错误');
        }
    }

    // 评分处理
    async function handleRating(e) {
        e.preventDefault();
        const data = {
            toUserId: parseInt(document.getElementById('rateUserId').value),
            score: parseInt(document.getElementById('rateScore').value),
            content: document.getElementById('rateContent').value
        };

        try {
            const response = await fetch(API_BASE + '/rating/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'token': currentToken
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.code === 200) {
                showMessage('ratingMessage', result.msg, true);
                document.getElementById('rateUserId').value = '';
                document.getElementById('rateScore').value = '';
                document.getElementById('rateContent').value = '';
                loadProfile();
                loadReceivedRatings();
            } else {
                showMessage('ratingMessage', result.msg || '评分失败', false);
            }
        } catch (error) {
            showMessage('ratingMessage', '网络错误', false);
        }
    }

    // 加载收到的评分
    async function loadReceivedRatings() {
        try {
            const response = await fetch(API_BASE + '/rating/received', {
                headers: { 'token': currentToken }
            });

            const data = await response.json();
            if (data.code === 200) {
                const ratings = data.data;
                if (ratings.length === 0) {
                    document.getElementById('receivedRatings').innerHTML = '<p style="text-align: center; color: #999;">暂无评分记录</p>';
                    return;
                }

                let html = '';
                ratings.forEach(rating => {
                    const stars = '⭐'.repeat(rating.score);
                    html += `
                            <div class="rating-item">
                                <div class="rating-header">
                                    <span>评分人ID: ${rating.fromUserId}</span>
                                    <span class="rating-score">${stars}</span>
                                </div>
                                <div style="color: #666;">${rating.content || '无评价内容'}</div>
                                <div style="color: #999; font-size: 12px; margin-top: 5px;">
                                    ${new Date(rating.createdAt).toLocaleString('zh-CN')}
                                </div>
                            </div>
                        `;
                });
                document.getElementById('receivedRatings').innerHTML = html;
            }
        } catch (error) {
            console.error('加载评分失败:', error);
        }
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('token');
        currentToken = null;
        currentUserData = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('mainSection').classList.add('hidden');
        document.getElementById('navBar').classList.add('hidden');
    }
</script>
</body>
</html>
